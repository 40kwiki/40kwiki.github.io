name: Build site

on:
  push:
    branches: [main]
    paths: ["src/**", "build.py"]
  pull_request:
    paths: ["src/**", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py
      - name: Commit the rebuilt site
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "40kwiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rebuild site from ${GITHUB_SHA::7}"
          git push
