name: Suggest an image
description: Better art for a page
labels: ["image"]
body:
  - type: input
    id: page
    attributes:
      label: Page
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Image link
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Artist or source
      description: Who made it, so it can be credited
